name: Build and Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 如果未来需要在 CI 里强制跑通测试，可以解除这段注释
      # - name: Run Persona Tests
      #   env:
      #     SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      #   run: python scripts/test_persona.py

      - name: Build Release Artifacts
        run: python scripts/pipeline.py release

      - name: Verify Deterministic Build
        run: python scripts/pipeline.py verify

      - name: Deploy to Release Branch
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}"
          python scripts/pipeline.py deploy --push
